<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coffee Delivery — delivery de cafés especiais. Escolha seu café favorito, veja a previsão de entrega pela distância e pague no checkout."
    />
    <meta name="theme-color" content="#FAFAFA" />
    <title>Coffee Delivery • Delivery de cafés especiais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the saved theme before the first paint to avoid a flash of the wrong theme.
      ;(() => {
        try {
          const stored = JSON.parse(
            window.localStorage.getItem('@coffee-delivery:theme-1.0.0'),
          )
          const theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          /* localStorage may be unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
